<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Water Meter Monitoring System architecture and production metrics">
  <rect width="1200" height="750" fill="#f7f6f2"/>
  <rect x="48" y="48" width="1104" height="654" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="2"/>
  <text x="88" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#6b675e" letter-spacing="1.5">PRODUCTION SYSTEM · PT PERTAMINA LUBRICANTS (PUG)</text>
  <text x="88" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#181816">Water Meter Monitoring &amp; Anomaly Alerts</text>
  <text x="88" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#525049">Automated daily 07:15 WIB pipeline across 27 flowmeters (F0–F26)</text>

  <!-- Pipeline boxes -->
  <rect x="88" y="250" width="310" height="190" rx="12" fill="#f7f6f2" stroke="#d7d3c8" stroke-width="2"/>
  <text x="114" y="292" font-family="monospace" font-size="15" font-weight="600" fill="#2f5d50">01 · INGESTION</text>
  <text x="114" y="330" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#181816">Google Sheets API</text>
  <text x="114" y="366" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• 27 plant flowmeters</text>
  <text x="114" y="394" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• 1,317 log entries processed</text>
  <text x="114" y="422" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• SQLite state &amp; history</text>

  <path d="M 408 345 L 438 345" stroke="#2f5d50" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="445" y="250" width="310" height="190" rx="12" fill="#f7f6f2" stroke="#d7d3c8" stroke-width="2"/>
  <text x="471" y="292" font-family="monospace" font-size="15" font-weight="600" fill="#2f5d50">02 · VALIDATION</text>
  <text x="471" y="330" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#181816">9 Deterministic Rules</text>
  <text x="471" y="366" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• Rules R1–R9 (replaced CV)</text>
  <text x="471" y="394" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• False positives −55% (11→5/wk)</text>
  <text x="471" y="422" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• 293 pytest tests passing</text>

  <path d="M 765 345 L 795 345" stroke="#2f5d50" stroke-width="3"/>

  <rect x="802" y="250" width="310" height="190" rx="12" fill="#f7f6f2" stroke="#d7d3c8" stroke-width="2"/>
  <text x="828" y="292" font-family="monospace" font-size="15" font-weight="600" fill="#2f5d50">03 · DISPATCH</text>
  <text x="828" y="330" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#181816">Gmail REST API</text>
  <text x="828" y="366" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• OAuth2 on Ubuntu VPS</text>
  <text x="828" y="394" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• 07:15 WIB (Mon–Sat)</text>
  <text x="828" y="422" font-family="system-ui, sans-serif" font-size="17" fill="#525049">• Per-PIC missing &amp; anomaly digest</text>

  <!-- Metrics footer -->
  <rect x="88" y="485" width="240" height="160" rx="12" fill="#181816"/>
  <text x="114" y="555" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f7f6f2">67 days</text>
  <text x="114" y="595" font-family="system-ui, sans-serif" font-size="17" fill="#c7c3b8">unattended uptime</text>

  <rect x="348" y="485" width="240" height="160" rx="12" fill="#181816"/>
  <text x="374" y="555" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f7f6f2">310 / 0</text>
  <text x="374" y="595" font-family="system-ui, sans-serif" font-size="17" fill="#c7c3b8">emails sent / failed</text>

  <rect x="608" y="485" width="240" height="160" rx="12" fill="#181816"/>
  <text x="634" y="555" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f7f6f2">293</text>
  <text x="634" y="595" font-family="system-ui, sans-serif" font-size="17" fill="#c7c3b8">pytest checks passing</text>

  <rect x="868" y="485" width="244" height="160" rx="12" fill="#2f5d50"/>
  <text x="894" y="555" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f7f6f2">−55%</text>
  <text x="894" y="595" font-family="system-ui, sans-serif" font-size="17" fill="#d9eae4">false anomaly alerts</text>
</svg>
